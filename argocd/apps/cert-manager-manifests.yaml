apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-manifests
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default

  source:
    repoURL: https://github.com/mazin1hn/eks.git
    targetRevision: main
    path: manifests/cert-manager

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true