apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd

spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io 
    chart: cert-manager
    targetRevision: 1.19.3

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

    helm:
      values: |
        installCRDs: true

  syncPolicy:
    syncOptions:
      - CreateNamespace=true