apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd-image-updater.argoproj.io/image-list: app=678536383905.dkr.ecr.eu-west-2.amazonaws.com/eks
    argocd-image-updater.argoproj.io/app.update-strategy: newest-build
    argocd-image-updater.argoproj.io/app.helm.image-name: deployment.image
    argocd-image-updater.argoproj.io/app.helm.image-tag: deployment.tag
    argocd-image-updater.argoproj.io/write-back-method: argocd
  name: eks-app
  namespace: argocd   
spec:
  project: default

  source:
    repoURL: https://github.com/mazin1hn/eks.git
    targetRevision: main
    path: helm/eks-app

  destination:
    server: https://kubernetes.default.svc
    namespace: eks-app

  syncPolicy:
    automated:
      enabled: true 
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true