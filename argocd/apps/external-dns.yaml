apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    chart: external-dns
    targetRevision: 1.20.0

    helm:
      values: |
        provider: cloudflare

        sources:
          - ingress

        policy: upsert-only

        domainFilters:
          - "mazin1hn.uk"  
      
        txtOwnerId: "eks_cluster"

        extraArgs:
          - --cloudflare-proxied
          - --zone-id-filter=4eb865c8c5349ae53c92f7bdac9f91da

        env:
          - name: CF_API_TOKEN
            valueFrom:
              secretKeyRef:
                name: cloudflare-api-token
                key: api-token

        serviceAccount:
          create: true
          name: external-dns

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      enabled: true 
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true