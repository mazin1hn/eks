apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argocd-image-updater
    targetRevision: 0.10.0
    helm:
      values: |
        config:
          logLevel: debug
          registries:
            - name: ecr
              api_url: https://678536383905.dkr.ecr.eu-west-2.amazonaws.com
              prefix: 678536383905.dkr.ecr.eu-west-2.amazonaws.com
              ping: yes
              aws_region: eu-west-2

        serviceAccount:
          create: true
          name: argocd-image-updater
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::678536383905:role/argocd-image-updater-role

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true