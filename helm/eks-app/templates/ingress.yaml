apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
 name: eks-ingress
 annotations:
  certmanager.io/cluster-issuer: letsencrypt-prod

spec:
 ingressClassName: traefik
 tls:
  - hosts:
     - eks.mazin1hn.uk
    secretName: eks-app-tls

 rules:
  - hosts: eks.mazin1hn.uk
    http:
     paths:
      - path: / 
        pathType: Prefix
        backend:
         service:
          name: clusterip-svc
          port:
           number: 80