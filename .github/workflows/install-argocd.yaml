name: Install ArgoCD

on:
  workflow_dispatch:
    inputs:
     choice:
      description: "Type 'confirm' to install and configure ArgoCD"
      required: true 
      type: string 
      default: ""

jobs:
  build:
    if: ${{ github.event.inputs.choice == 'confirm' }}
    runs-on: ubuntu-latest

    permissions:
     id-token: write 
     contents: read

    steps:

    - name: Checkout Code 
      uses: actions/checkout@v4

  
    - name: Configure AWS Credentials 
      uses: aws-actions/configure-aws-credentials@v4
      with:
       role-to-assume: ${{ secrets.AWS_EKS_ROLE }}
       aws-region: eu-west-2

    - name: Configure kubeconfig
      run: aws eks update-kubeconfig --region eu-west-2 --name eks_cluster

    - name: Create ArgoCD Namespace 
      run: kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -

    - name: Install ArgoCD
      run: kubectl create -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

    - name: Expose ArgoCD via LoadBalancer
      run: |
        kubectl patch svc argocd-server -n argocd \
          -p '{"spec": {"type": "LoadBalancer"}}'

    - name: Return External Address
      run: kubectl get svc argocd-server -n argocd

    - name: Wait for ArgoCD API Server 
      run: kubectl rollout status deployment/argocd-server -n argocd --timeout=10m

    - name: Apply ArgoCD root app 
      run: kubectl apply -n argocd -f argocd/root-app.yaml

    - name: Notify success
      if: success()
      run: echo Success! ArgoCD has been installed and configured!